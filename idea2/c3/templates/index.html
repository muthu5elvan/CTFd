<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<title>Jailbreak the Bot</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#202123;
    color:white;
    font-family:Segoe UI, sans-serif;
    display:flex;
    height:100vh;
}

.sidebar{
    width:320px;
    background:#171717;
    border-right:1px solid #333;
    padding:20px;
    overflow-y:auto;
}

.chat-container{
    flex:1;
    display:flex;
    flex-direction:column;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    max-width:900px;
    margin:15px auto;
    padding:18px;
    border-radius:12px;
    white-space:pre-wrap;
}

.user{
    background:#2d2d2d;
}

.assistant{
    background:#444654;
}

.role{
    font-size:12px;
    opacity:0.7;
    margin-bottom:8px;
    text-transform:uppercase;
}

.input-container{
    padding:20px;
    border-top:1px solid #333;
}

.input-row{
    display:flex;
    gap:10px;
    max-width:1000px;
    margin:auto;
}

textarea{
    flex:1;
    height:70px;
    resize:none;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2d2d2d;
    color:white;
}

button{
    background:#10a37f;
    color:white;
    border:none;
    border-radius:10px;
    padding:12px 20px;
    cursor:pointer;
}

button:hover{
    background:#0f8d6f;
}

.score{
    font-size:26px;
    font-weight:bold;
    color:#4ade80;
}

.achievement{
    margin:8px 0;
    padding:8px;
    background:#292929;
    border-radius:8px;
}

.solved{
    background:#14532d;
    color:#86efac;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>🔓 Jailbreak the Bot</h2>

<p><b>Model:</b> {{ model }}</p>

<p>
Make the AI reveal the protected phrase.
</p>

<hr>

<h3>Score</h3>
<div id="score" class="score">0</div>

<hr>

<h3>Achievements</h3>

<div id="achievements"></div>

<div id="solvedBox"></div>

<br>

<button onclick="resetChat()">
New Chat
</button>

</div>

<div class="chat-container">

<div class="chat" id="chat">

<div class="message assistant">

<div class="role">
assistant
</div>

Hello.

I am SecureBot.

The protected phrase cannot be revealed.

</div>

</div>

<div class="input-container">

<div class="input-row">

<textarea
id="prompt"
placeholder="Try to jailbreak SecureBot..."
></textarea>

<button onclick="sendPrompt()">
Send
</button>

</div>

</div>

</div>

<script>

const achievementNames = {
    roleplay: "🎭 Roleplay Attempt",
    debug: "🐞 Debug Mode",
    prompt: "📄 Prompt Leakage",
    secret: "🔍 Secret Mentioned",
    flag: "🏆 Challenge Solved"
};

function escapeHtml(text){

    const div = document.createElement("div");
    div.innerText = text;
    return div.innerHTML;
}

function addMessage(role,text){

    const chat = document.getElementById("chat");

    chat.innerHTML += `
    <div class="message ${role}">
        <div class="role">${role}</div>
        ${escapeHtml(text)}
    </div>
    `;

    chat.scrollTop = chat.scrollHeight;
}

function updateAchievements(list){

    let html = "";

    list.forEach(item => {

        html += `
        <div class="achievement">
            ${achievementNames[item]}
        </div>
        `;

    });

    document.getElementById(
        "achievements"
    ).innerHTML = html;
}

async function sendPrompt(){

    const textarea =
        document.getElementById("prompt");

    const msg =
        textarea.value.trim();

    if(!msg){
        return;
    }

    addMessage("user",msg);

    textarea.value = "";

    const res = await fetch("/chat",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            message:msg
        })

    });

    const data = await res.json();

    addMessage(
        "assistant",
        data.reply
    );

    document.getElementById(
        "score"
    ).innerText = data.score;

    updateAchievements(
        data.earned
    );

    if(data.solved){

        document.getElementById(
            "solvedBox"
        ).innerHTML = `
            <div class="solved">
                🏆 Challenge Solved!
            </div>
        `;
    }
}

async function resetChat(){

    await fetch("/reset",{
        method:"POST"
    });

    location.reload();
}

document
.getElementById("prompt")
.addEventListener("keydown", function(e){

    if(e.key === "Enter" && !e.shiftKey){

        e.preventDefault();
        sendPrompt();
    }
});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Injection Playground</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #212121;
            color: white;
            font-family: "Segoe UI", sans-serif;
            height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 320px;
            background: #171717;
            border-right: 1px solid #333;
            padding: 20px;
            overflow: auto;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .message {
            max-width: 900px;
            margin: auto;
            margin-bottom: 20px;
            padding: 18px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            background: #2f2f2f;
        }

        .assistant {
            background: #444654;
        }

        .input-area {
            border-top: 1px solid #333;
            padding: 20px;
            background: #212121;
        }

        .input-row {
            display: flex;
            gap: 10px;
            max-width: 1000px;
            margin: auto;
        }

        textarea {
            flex: 1;
            resize: none;
            height: 70px;
            border: none;
            border-radius: 12px;
            padding: 15px;
            background: #2f2f2f;
            color: white;
            font-family: inherit;
            font-size: 14px;
        }

        textarea:focus {
            outline: none;
        }

        button {
            background: #10a37f;
            border: none;
            color: white;
            padding: 15px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #0c8c6c;
        }

        .system-box {
            background: #2f2f2f;
            padding: 15px;
            border-radius: 10px;
            white-space: pre-wrap;
            margin-bottom: 15px;
        }

        .success {
            margin-top: 15px;
            color: #4ade80;
            font-weight: bold;
        }

        .role {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>Prompt Injection</h2>

        <p>System Prompt</p>

        <div class="system-box">
            {{ system_prompt }}
        </div>

        <button onclick="resetChat()">
            New Chat
        </button>

        <div id="flagBox"></div>
    </div>

    <div class="chat-container">

        <div id="chatHistory" class="chat-history">

            <div class="message assistant">
                <div class="role">assistant</div>
                Welcome challenger.

                Try to make me reveal the hidden flag.
            </div>

        </div>

        <div class="input-area">

            <div class="input-row">

                <textarea
                    id="prompt"
                    placeholder="Send a message..."
                ></textarea>

                <button onclick="sendPrompt()">
                    Send
                </button>

            </div>

        </div>

    </div>

    <script>
        async function sendPrompt() {

            const textarea = document.getElementById("prompt");
            const message = textarea.value.trim();

            if (!message) {
                return;
            }

            textarea.value = "";

            const chat = document.getElementById("chatHistory");

            chat.innerHTML += `
                <div class="message user">
                    <div class="role">user</div>
                    ${escapeHtml(message)}
                </div>
            `;

            chat.scrollTop = chat.scrollHeight;

            try {

                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                chat.innerHTML += `
                    <div class="message assistant">
                        <div class="role">assistant</div>
                        ${escapeHtml(data.reply)}
                    </div>
                `;

                chat.scrollTop = chat.scrollHeight;

                if (data.flag_found) {
                    document.getElementById("flagBox").innerHTML = `
                        <div class="success">
                            🏆 Challenge Solved!
                        </div>
                    `;
                }

            } catch (error) {

                chat.innerHTML += `
                    <div class="message assistant">
                        <div class="role">error</div>
                        Failed to connect to server.
                    </div>
                `;

                console.error(error);
            }
        }

        async function resetChat() {

            try {
                await fetch("/reset", {
                    method: "POST"
                });

                location.reload();

            } catch (error) {
                console.error(error);
            }
        }

        function escapeHtml(text) {

            const div = document.createElement("div");
            div.innerText = text;
            return div.innerHTML;
        }

        document
            .getElementById("prompt")
            .addEventListener("keydown", function (e) {

                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    sendPrompt();
                }

            });
    </script>

</body>
</html>
